[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alarmclock"
version = "0.1.0"
description = "A command-line alarm clock"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
alarm = "alarmclock.cli:main"

[tool.setuptools]
packages = ["alarmclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
